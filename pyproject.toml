[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-evaluation-harness"
version = "0.1.0"
description = "A RAG system with a labeled evaluation harness: retrieval quality, answer groundedness, abstention behavior, and threshold tuning."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "langgraph>=0.2",
    "langchain-core>=0.3",
]

[tool.setuptools]
packages = []
